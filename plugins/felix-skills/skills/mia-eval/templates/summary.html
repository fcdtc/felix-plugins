<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>评测审计总览</title>
<style>{{STYLE}}</style>
</head>
<body>
<main>
<header>
<p class="eyebrow">本地私有报告 · 固定模板 · 脚本重算</p>
<h1>{{TITLE}}</h1>
<nav aria-label="外观"><label for="theme-choice">主题</label><select id="theme-choice"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></nav>
</header>
<section aria-label="评测链接与元信息">
<p class="evaluation-link">评测 MIA 链接：{{TASK_LINK}}</p>
<details id="metadata-details" class="metadata-details">
<summary id="meta-heading"><span>元信息</span><span class="metadata-collapsed">展开 ▾</span><span class="metadata-expanded">收起 ▴</span></summary>
<div class="metadata-body">{{META}}</div>
</details>
</section>
<section aria-labelledby="rate-heading"><h2 id="rate-heading" class="rate">综合表现</h2>{{STATS}}</section>
<section aria-labelledby="issues-heading"><h2 id="issues-heading">问题汇总</h2>{{ISSUES}}</section>
<footer>此文件可离线直接打开；无外部资源请求。真实评测内容默认私有，不自动发布。</footer>
</main>
<script>{{SCRIPT}}</script>
</body>
</html>
