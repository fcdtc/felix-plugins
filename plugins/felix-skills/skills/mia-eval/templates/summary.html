<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>评测审计总览</title>
<style>{{STYLE}}</style>
</head>
<body>
<main>
<header>
<p class="eyebrow">本地私有报告 · 固定模板 · 脚本重算</p>
<h1>{{TITLE}}</h1>
<nav aria-label="外观"><label for="theme-choice">主题</label><select id="theme-choice"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></nav>
</header>
<section aria-labelledby="meta-heading"><h2 id="meta-heading">元信息</h2>{{META}}</section>
<section aria-labelledby="rate-heading"><h2 id="rate-heading" class="rate">综合表现</h2><p>{{RATE}}</p>{{STATS}}</section>
<section aria-labelledby="issues-heading"><h2 id="issues-heading">问题汇总</h2>{{ISSUES}}</section>
<section aria-labelledby="cases-heading"><h2 id="cases-heading">全部 case</h2>
<div class="filters"><label for="case-search">搜索</label><input id="case-search" type="search" placeholder="标题、case key 或判定依据"><label for="case-status">结论</label><select id="case-status"><option value="">全部</option><option>顺畅通过</option><option>失败</option><option>恢复/挣扎</option><option>证据不足</option></select></div>
<p id="visible-count" aria-live="polite">下表包含 manifest 全部 case。</p>
{{CASES}}
<noscript><p>脚本已禁用；全部 case 仍可阅读，筛选不可用。</p></noscript>
</section>
<footer>此文件可离线直接打开；无外部资源请求。真实评测内容默认私有，不自动发布。</footer>
</main>
<script>{{SCRIPT}}</script>
</body>
</html>
